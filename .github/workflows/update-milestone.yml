name: Update Milestone

on:
  push:
    branches:
      - main

permissions:
  issues: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    name: update-milestone

    steps:
      - uses: smallrye/milestone-set-action@main
        name: milestone set
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
